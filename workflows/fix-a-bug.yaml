name: Fix a bug
description: Plan the fix, get your approval, fix it with a draft PR, review it and fix what blocks.
offerInTracket: true
maxParallelRuns: 2
steps:
- id: plan
  agent: planner
  instructions: Read the ticket and the code it concerns, then write a short plan. Do not change any file.
- id: approve
  approval:
    summary: steps.plan.output
  onReject: plan
- id: fix
  agent: fixer
  input: steps.plan.output
  instructions: Fix the bug as planned, add a test that fails without the fix, run the tests, push a branch named after the ticket and open a draft PR.
- id: review
  agent: code-reviewer
  input: steps.fix.output
  instructions: Review the branch's changes against the main branch.
  output: { blocking: number, findings: text }
- id: blocked
  if: steps.review.output.blocking > 0
  then:
  - id: refix
    agent: fixer
    input: steps.review.output.findings
    instructions: Fix the blocking findings of this review, run the tests, and push the fix to the PR's branch.
