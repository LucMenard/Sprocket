[package]
name = "sprocket"
version = "0.2.0"
description = "Runs Claude agent workflows on Jira tickets, beside Tracket"
edition = "2021"
rust-version = "1.90"

[lib]
name = "sprocket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
axum = "0.8"
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native"] }
log = "0.4.35"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["net", "process", "io-util", "sync", "time", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"
